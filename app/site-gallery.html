<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talanta Twin · Full site views</title>
<style>
  body { margin: 0; background: #f3f5f2; color: #172d24; font: 16px system-ui, sans-serif; }
  main { max-width: 76rem; margin: auto; padding: 2rem clamp(1rem, 4vw, 4rem); }
  h1 { font-size: clamp(2rem, 5vw, 3.75rem); margin: .65rem 0; }
  a { color: #15523b; }
  section { display: grid; gap: 1.25rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  figure { margin: 0; background: white; }
  figure:first-child { grid-column: 1 / -1; }
  img { display: block; width: 100%; height: auto; }
  figcaption { padding: 1rem; }
  figcaption strong { display: block; margin-bottom: .35rem; }
  @media (max-width: 42rem) { section { grid-template-columns: 1fr; } }
</style>
<main>
  <a href="./perimeter.html">Back to the interactive stadium</a>
  <h1>Full site views</h1>
  <p>Blender studies of Talanta Stadium and its surroundings. Road alignments and plaza details are estimated.</p>
  <section aria-label="Site render gallery">
    <figure>
      <img src="./site-gallery/C08_neutral_check.webp" width="960" height="540" alt="Aerial view of Talanta Stadium with the surrounding landscape and city massing">
      <figcaption><strong>Stadium and surroundings</strong>The stadium bowl, practice grounds and surrounding landscape in daylight.</figcaption>
    </figure>
    <figure>
      <img src="./site-gallery/C15_neutral_check.webp" width="960" height="540" loading="lazy" alt="Paved forecourt with fountain jets below the stadium facade">
      <figcaption><strong>Plaza and facade</strong>The forecourt paving, fountain line and landscaped edge.</figcaption>
    </figure>
    <figure>
      <img src="./site-gallery/C06_night_check.webp" width="960" height="540" loading="lazy" alt="Elevated night view with illuminated stadium facade and perimeter lights">
      <figcaption><strong>Stadium after dark</strong>The facade and perimeter lighting in the night study.</figcaption>
    </figure>
  </section>
</main>
</html>
