<!doctype html>
<!-- Scroll-scrub test page (2026-10-25). Serve the frames folder next to this page:
     cp blender/scroll_test/scrub_demo.html blender/out/scroll_test_01/web/ and run a static server there.
     Internal test only; the frames show illustrative people, cars and lights (Visualization). -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll scrub test</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 14px system-ui, sans-serif; }
  #track { height: 400vh; }
  #stage { position: fixed; inset: 0; }
  canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
  #claim { position: fixed; left: 16px; bottom: 16px; background: #f5f1e8ed; color: #222; padding: 7px 14px; border-radius: 20px; font-size: 12px; }
  #info { position: fixed; right: 16px; top: 16px; background: #0009; padding: 6px 10px; border-radius: 6px; }
</style></head><body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="track"></div>
<div id="claim">Rendered from the twin model · Visualization: people, vehicles and lighting are illustrative</div>
<div id="info">loading</div>
<script>
const N = 24, small = innerWidth < 900, dir = small ? 'webp_960' : 'webp_1920';
const c = document.getElementById('c'), ctx = c.getContext('2d'), info = document.getElementById('info');
const imgs = [], t0 = performance.now(); let loaded = 0, shown = -1;
for (let i = 0; i < N; i++) {
  const im = new Image(); im.decoding = 'async';
  im.onload = () => { loaded++; if (i === 0) draw(0); info.textContent = `${loaded}/${N} frames, ${((performance.now() - t0) / 1000).toFixed(1)} s`; };
  im.src = `${dir}/frame_${String(i).padStart(3, '0')}.webp`; imgs.push(im);
}
function draw(i) {
  const im = imgs[i]; if (!im.complete || !im.naturalWidth || i === shown) return;
  c.width = im.naturalWidth; c.height = im.naturalHeight; ctx.drawImage(im, 0, 0); shown = i;
}
addEventListener('scroll', () => {
  const t = scrollY / (document.documentElement.scrollHeight - innerHeight);
  requestAnimationFrame(() => draw(Math.min(N - 1, Math.max(0, Math.round(t * (N - 1))))));
}, { passive: true });
</script></body></html>
